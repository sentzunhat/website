    <style>
      :root { --boot-canvas: #fdfdfd; --boot-line: #d8e5e7; --boot-surface: #f5fbfc; }
      :root[data-theme='dark'] { --boot-canvas: #080c18; --boot-line: #26394a; --boot-surface: #10152a; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) { --boot-canvas: #080c18; --boot-line: #26394a; --boot-surface: #10152a; }
      }
      body { margin: 0; background: var(--boot-canvas); }
      .boot-shell { min-height: 100vh; color: transparent; font-family: Arial, sans-serif; }
      .boot-nav, .boot-main { width: min(100% - 2rem, 70rem); margin-inline: auto; }
      .boot-nav { display: flex; height: 5.5rem; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--boot-line); }
      .boot-mark, .boot-wordmark, .boot-nav-items, .boot-eyebrow, .boot-heading, .boot-copy, .boot-actions span, .boot-section-heading, .boot-card { display: block; border-radius: .45rem; background: color-mix(in srgb, var(--boot-line) 68%, var(--boot-surface)); animation: boot-pulse 1.6s ease-in-out infinite; }
      .boot-mark { width: 4rem; height: 2rem; border-radius: 999px; }
      .boot-wordmark { width: auto; height: auto; margin-left: -64%; background: none; color: color-mix(in srgb, var(--boot-line) 44%, var(--boot-canvas)); font-size: .9rem; font-weight: 700; letter-spacing: -.03em; }
      .boot-nav-items { width: 7rem; height: .75rem; }
      .boot-main { padding-top: clamp(5rem, 13vw, 9rem); }
      .boot-loading-label { margin: 0 0 1.25rem; color: color-mix(in srgb, var(--boot-line) 55%, var(--boot-canvas)); font-size: .9rem; letter-spacing: -.01em; }
      .boot-eyebrow { width: 13rem; height: .65rem; }
      .boot-heading { height: clamp(3rem, 7vw, 5rem); margin-top: 1.25rem; }
      .boot-heading-wide { width: min(34rem, 78%); }
      .boot-heading-narrow { width: min(24rem, 56%); margin-top: .6rem; }
      .boot-copy { width: min(30rem, 80%); height: .95rem; margin-top: 2rem; }
      .boot-copy-short { width: min(24rem, 64%); margin-top: .65rem; }
      .boot-actions { display: flex; gap: .75rem; margin-top: 2rem; }
      .boot-actions span { width: 10rem; height: 2.9rem; border-radius: 999px; }
      .boot-actions span + span { width: 7rem; background: transparent; border: 1px solid var(--boot-line); }
      .boot-focus { margin-top: clamp(7rem, 14vw, 11rem); padding-bottom: 4rem; }
      .boot-section-heading { width: min(24rem, 68%); height: 2rem; margin-top: 1.25rem; }
      .boot-card { width: 100%; height: 19rem; margin-top: 1.5rem; border: 1px solid var(--boot-line); background: var(--boot-surface); }
      @keyframes boot-pulse { 50% { opacity: .5; } }
      @media (max-width: 640px) {
        .boot-nav, .boot-main { width: min(100% - 2rem, 70rem); }
        .boot-nav { height: 5rem; }
        .boot-wordmark { margin-left: -12%; }
        .boot-nav-items { width: 4rem; }
        .boot-heading-wide { width: 92%; }
        .boot-heading-narrow { width: 72%; }
        .boot-copy, .boot-copy-short { width: 92%; }
      }
      @media (prefers-reduced-motion: reduce) { .boot-shell * { animation: none; } }
    </style>

          <div class="boot-actions"><span></span><span></span></div>
          <section class="boot-focus"><span class="boot-eyebrow"></span><span class="boot-section-heading"></span><span class="boot-card"></span></section>
        </main>
      </div>
    </div>
